<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5"  lang="">

<head>
    <title>MakersBnB</title>
</head>

<body>
<div sec:authorize="isAuthenticated()">
    Hello, you are logged in as <span sec:authentication="principal.attributes['email']"></span>
</div>

<div sec:authorize="isAuthenticated()">
    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</div>
<h1>Welcome to MakersBnB</h1>

<form th:action="@{/bookings}" method="get">
    <button type="Submit">My Bookings</button>
</form>

<!-- th:text is a Thymeleaf atttribute used to generate the actual `h3` text -->
<!-- within it, we use nSpaces which was passed in from the controller -->
<h3 th:text="${nSpaces} + ' spaces are waiting to be discovered'"></h3>

<form th:action="@{/spaces}" method="get">
    <button type="submit">To Available Spaces</button>
</form>


<h5>Recent reviews</h5>
<ul>
    <!-- using th:each we tell Thymeleaf to render an li for each review -->
    <li th:each="review : ${reviews}" th:text="${review}"></li>
</ul>


</body>

</html>
